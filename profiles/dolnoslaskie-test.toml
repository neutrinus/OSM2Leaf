# dolnoslaskie-test: single-tile test slice for ZE0 (X08-02-00) L1/L2 validation.
#
# One containing tile only (B48R058R, Wrocław area) so that an OSM-derived
# tile can be compared against the factory tile without touching the rest of
# the card. Road set is the core network (motorway-secondary) to keep the
# extract small; addresses, POIs and admin boundaries are intentionally out of
# scope for this slice (see docs/research/osm-vertical-slice.md).
#
# This is a build profile for tools/ze0-viewer/vendor/osm2clarion, not a
# production map profile.

name = "dolnoslaskie-test"
description = "Single-tile (B48R058R, Wrocław area) ZE0 test slice; core roads only."
country = 616            # ISO 3166 numeric for Poland

[source]
# Small bbbike extract keeps the first run cheap; swap for the Geofabrik
# Dolnośląskie/Poland extract for a real build.
osm = "build/Wroclaw.osm.pbf"
roads = "build/roads_dolnoslaskie-test.json"
coastline = "build/coast_dolnoslaskie-test.json"

[grid]
# One tile only. B48R058R covers 48.00..53.33 N, 12.00..20.00 E and contains
# Wrocław. Keep the shipped European database box unchanged.
cells = ["B48R058R"]
bounds = [4800, 1280, -1200, 4080]
bbox = { lon_min = 12.0, lon_max = 20.0, lat_min = 48.0, lat_max = 53.333333 }

[roads]
simplify_metres = 2
skip = []
l2_classes = "wide"
l2_simplify_metres = 5
l2_graph = false
coarse_classes = ["motorway", "trunk", "primary", "motorway_link", "trunk_link", "primary_link"]
coarse_simplify_metres = 20
speed_unit = "km/h"

[land]
level_6 = { min_area = 0.001, simplify = 0.02 }
level_5 = { min_area = 0.001, simplify = 0.01 }
level_4 = { min_area = 0.0002, simplify = 0.003 }
level_3 = { min_area = 0.00003, simplify = 0.001 }

[labels]
sea = "BALTIC SEA"
coarse = ""

[targets]
default = "ze0-2011"
ze0-2011 = { label = "ZE0 2011 European database", volume = "QSD-309-101" }
