name: Main gate watchdog

# H117: a `push` run of the gate on `main` is cancelled by the next push, so a
# red gate can ride into `main` unnoticed (2026-11-20 04:12-04:36Z: 4 red runs,
# 16 merges).  This watchdog runs after every gate run on `main`, fails while
# the newest unmasked red is unaddressed, and opens/updates one `[H117] fix:`
# issue naming the SHA and the failing step.  The preferred fix is H98 branch
# protection (required PR checks); this is the fallback until it lands.
#
# The policy lives in `.github/scripts/main_watch.py` so it has an offline
# `--selftest` and can be replayed against a saved run list (the H117 EXP).

on:
  workflow_run:
    workflows: ["CI quality gate", "L1/L2 synthetic fixtures"]
    types: [completed]
    branches: [main]
  schedule:
    # a coverage sweep: a cancelled run creates no `workflow_run`, so a burst
    # that ends in cancellations is only seen by a later full read
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: main-watch
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Offline selftest of the policy
        shell: bash
        run: python .github/scripts/main_watch.py --selftest

      - name: Gate verdict on main
        id: watch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python .github/scripts/main_watch.py \
            --branch main --workflow "CI quality gate" --limit 40 \
            --json main-watch.json 2>&1 | tee main-watch.txt
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: PR-head verdict (H126)
        id: prs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python .github/scripts/main_watch.py --prs \
            --json pr-heads.json 2>&1 | tee pr-heads.txt
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # A scheduled sweep fails the run on a stale PR head, but never masks
          # the main verdict: the final step ORs the two exit codes.
          exit $rc

      - name: Verdict summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          def load(name):
              try:
                  with open(name, encoding='utf-8') as f:
                      return json.load(f)
              except OSError:
                  return None
          d = load('main-watch.json')
          p = load('pr-heads.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Main gate watchdog (H117)\n\n')
              if d is None:
                  out.write('*no verdict document (the watchdog did not run)*\n')
              else:
                  c = d['counts']
                  out.write('| quantity | value |\n| --- | --- |\n')
                  out.write(f"| tip | `{str(d['tip_sha'])[:8]}` **{d['tip_conclusion']}** |\n")
                  out.write(f"| salient red (unaddressed) | {c['salient']} |\n")
                  out.write(f"| shadowed red (later green covers) | {c['shadowed']} |\n")
                  out.write(f"| cancelled (concurrency de-dup) | {c['cancelled']} |\n")
                  out.write(f"| runs read | {c['runs']} |\n")
              out.write('\n- A **salient** red opens/updates one `[H117] fix:` issue naming the SHA and the failing step; the step fails while it is open.\n')
              out.write('- A **shadowed** red is counted, not failed: a later green run on `main` covers it. This is the count H117 watches.\n')
              out.write('\n## PR-head sweep (H126)\n\n')
              if p is None:
                  out.write('*no PR-head document (the sweep did not run)*\n')
              else:
                  c = p['counts']
                  out.write('| quantity | value |\n| --- | --- |\n')
                  out.write(f"| open PRs (incl. drafts) | {c['open']} |\n")
                  out.write(f"| open non-draft PRs | {c['open_non_draft']} |\n")
                  out.write(f"| stale heads (no completed gate check-run) | {c['stale']} |\n")
                  stale = [v for v in p['prs'] if v['state'] == 'stale']
                  for v in stale:
                      out.write(f"- **#{v['number']}** head `{v['head_short']}` last tested `{str(v['last_tested_sha'])[:8]}`\n")
              out.write('\n- An open non-draft PR head with 0 completed gate check-runs opens/updates one `[H126] fix:` issue; the sweep fails while it exists.\n')
              out.write('- A `pending` run is not stale (the sweep waits); a draft is out of scope.\n')
              out.write('- Policy: `.github/scripts/main_watch.py` (`--selftest`, `--replay RUNS_JSON`, `--replay-pr PR_JSON`). Not a gate-semantics tool; `tools/gate.py` is unchanged.\n')
          PY

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-watch
          path: |
            main-watch.json
            main-watch.txt
            pr-heads.json
            pr-heads.txt
          if-no-files-found: warn
