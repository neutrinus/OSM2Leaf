name: Main gate watchdog

# H117: a `push` run of the gate on `main` is cancelled by the next push, so a
# red gate can ride into `main` unnoticed (2026-11-20 04:12-04:36Z: 4 red runs,
# 16 merges).  This watchdog runs after every gate run on `main`, fails while
# the newest unmasked red is unaddressed, and opens/updates one `[H117] fix:`
# issue naming the SHA and the failing step.  The preferred fix is H98 branch
# protection (required PR checks); this is the fallback until it lands.
#
# The policy lives in `.github/scripts/main_watch.py` so it has an offline
# `--selftest` and can be replayed against a saved run list (the H117 EXP).
#
# M9.64: the two triggers below run *different* checks, so the verdict step runs
# the sweep once per workflow with its own `--workflow` (M9.64).  A green
# `L1/L2 synthetic fixtures` run never covers a red `CI quality gate` run; each
# workflow has its own salient/shadowed verdict line.

on:
  workflow_run:
    workflows: ["CI quality gate", "L1/L2 synthetic fixtures"]
    types: [completed]
    branches: [main]
  schedule:
    # a coverage sweep: a cancelled run creates no `workflow_run`, so a burst
    # that ends in cancellations is only seen by a later full read
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: main-watch
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Offline selftest of the policy
        shell: bash
        run: python .github/scripts/main_watch.py --selftest

      - name: Gate verdict on main (CI quality gate)
        id: watch_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python .github/scripts/main_watch.py \
            --branch main --workflow "CI quality gate" --limit 40 \
            --json main-watch-gate.json 2>&1 | tee main-watch-gate.txt
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Gate verdict on main (L1/L2 synthetic fixtures)
        id: watch_l1l2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python .github/scripts/main_watch.py \
            --branch main --workflow "L1/L2 synthetic fixtures" --limit 40 \
            --json main-watch-l1l2.json 2>&1 | tee main-watch-l1l2.txt
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Verdict summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          def load(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except OSError:
                  return None
          docs = [('CI quality gate', load('main-watch-gate.json')),
                  ('L1/L2 synthetic fixtures', load('main-watch-l1l2.json'))]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Main gate watchdog (H117)\n\n')
              out.write('Each workflow is classified on its own run list: a green run')
              out.write(' of one workflow never covers a red run of the other (M9.64).\n\n')
              out.write('| workflow | tip | salient red | shadowed red | unrelated green | cancelled | runs read |\n')
              out.write('| --- | --- | --- | --- | --- | --- | --- |\n')
              for name, d in docs:
                  if d is None:
                      out.write(f'| {name} | *no verdict document* | | | | | |\n')
                      continue
                  c = d['counts']
                  out.write(f"| {name} | `{str(d['tip_sha'])[:8]}` **{d['tip_conclusion']}** | "
                            f"{c['salient']} | {c['shadowed']} | {c.get('unrelated_green', 0)} | "
                            f"{c['cancelled']} | {c['runs']} |\n")
              out.write('\n- A **salient** red opens/updates one `[H117] fix:` issue naming the SHA and the failing step; the step fails while it is open.\n')
              out.write('- A **shadowed** red is counted, not failed: a later green run of the *same* workflow on `main` covers it.\n')
              out.write('- An **unrelated green** is a green run of the other workflow; it covers nothing and is counted, never failed.\n')
              out.write('- Policy: `.github/scripts/main_watch.py` (`--selftest`, `--replay RUNS_JSON`). Not a gate-semantics tool; `tools/gate.py` is unchanged.\n')
          PY

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-watch
          path: |
            main-watch-gate.json
            main-watch-l1l2.json
            main-watch-gate.txt
            main-watch-l1l2.txt
          if-no-files-found: warn
